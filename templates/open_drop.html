{% extends 'base.html' %}

{% block content %}
    {% if error %}
    <p class="text-red-500">{{ error }}</p>
    {% endif %}

    {% if text_url %}
    <div class="border-2 border-[rgb(88,164,176)] mt-20 p-3 w-100">
      <p>{{ text_url }}</p>
    </div>
    <form method="POST" action="{% url 'destroy_drop' %}">
        {% csrf_token %}
        <input type="hidden" name="lookup" value="{{ lookup }}">
        <button type="submit" class="px-3 py-2 my-5 bg-red-500 text-white cursor-pointer">Destroy this drop</button>
    </form>
    {% endif %}
{% endblock %}
