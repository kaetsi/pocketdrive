{% extends 'base.html' %}

{% block content %}
      <form method="POST" action="{% url 'retrive_drop' %}" class="action-section flex flex-col my-10">
        {% csrf_token %}
        <label for="">PIN:</label>
        <input class="border-2 border-[rgb(88,164,176)] rounded-2l p-3 w-100" type="text" name="pin">
        <label class="pt-5" for="">Magic Word:</label>
        <input class="border-2 border-[rgb(88,164,176)] rounded-2l p-3 w-100" type="text" name="magic_word">
        <button class="px-3 py-2 my-5 bg-sky-500 text-white cursor-pointer">Retrive</button>
      </form>
{% endblock %}
